<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Jogo da Cobrinha</title>
    <link rel="stylesheet" href="src/css/estilos.css">
</head>
<body>
    <h1>Jogo da Cobrinha</h1>
    <canvas id="gameCanvas" width="400" 

height="400"></canvas>
    <div class="controls">
        <p>Use as setas do teclado ou os botões para mover a cobrinha.</p>
        <button id="startButton">Iniciar Jogo</button>

        <div class="mobile-controls">
            <button id="upButton" class="control-btn">⬆️</button>
            <div class="horizontal-btns">
                <button id="leftButton" class="control-btn">⬅️</button>
                <button id="rightButton" class="control-btn">➡️</button>
            </div>
            <button id="downButton" class="control-btn">⬇️</button>
        </div>
    </div>
    <script src="src/js/javascript.js"></script>

</body>
</html>
